<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mini Wave Practice</title>
<style>
:root{--bg:#1c6b3a;--fg:#fff}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d',{desynchronized:true});
const U=30, VIEW_H=11*U;
const SPEEDS=[{v:251.16,l:'0.5x',c:'#4aa3ff'},{v:311.58,l:'1x',c:'#ffd84a'},{v:387.42,l:'2x',c:'#4aff8a'},{v:468,l:'3x',c:'#ff5a8a'}];   // GD speeds in units/second
const SLOPE=2, HALF=3, CAM_OFFSET=.3, CAM_FOLLOW=5;   // CAM_FOLLOW: vertical camera smoothing (lower = lazier/calmer)

// ---- Guide lines (nothing kills you; leaving the lines lowers accuracy) ----
const DURATION=300;        // every practice section lasts 5 minutes, whatever speed you pick
const STRAIGHT_GAP=1.5;   // channel height in blocks for STRAIGHT (smaller = harder)
// builds the guide lines of a section; the pattern repeats until 5 minutes worth of distance
function buildSec(id){
  const P=PAT[id],s=SEC[id],len=DURATION*speed/U,c=v=>P.flip?11-v:v;
  if(P.slope!==undefined){s.pts=[[P.x,P.y,P.gap],[P.x+len,P.y+P.slope*len,P.gap]];s.end=P.x+len;return}   // one long diagonal channel
  let x=P.x,i=0;
  const pts=[[x,c(P.y),P.segs[0][2]]];
  while(x<P.x+len){const [n0,y1,g]=P.segs[i],n=P.time?n0*speed/U:n0;x+=n;pts.push([x,c(y1),g]);i++;if(i>=P.segs.length)i=P.loop}
  s.pts=pts;s.end=P.x+len;if(id==='mix')SEC.hub.end=s.end;
}
const SPD_X=30,LANE_X=46,MIX_X=56,STR_X=6000,UP_X=12000,DN_X=18000;
const upSegs=[[4,1.8,3],[12,9.2,2.8],[4,1.8,3],[14,9.2,2.4],[4,1.8,3],[16,9.2,2.1],[4,1.8,3],[20,9.2,1.8]];
const MIX_GAP=2.2;   // zigzag channel height in blocks (smaller = tighter)
const MIX_HALF=0.8;  // seconds for one full rise or one full fall (shorter = narrower zigzag)
const PAT={
  mix:{x:MIX_X,y:5.3,loop:1,time:1,segs:[[MIX_HALF/2,8.05,MIX_GAP],[MIX_HALF,2.55,MIX_GAP],[MIX_HALF,8.05,MIX_GAP]]},   // zigzag: centre swings 2.55 <-> 8.05; segment lengths are in SECONDS
  straight:{x:STR_X,y:5.5,loop:0,segs:[[200,5.5,STRAIGHT_GAP]]},
  up:{x:UP_X,y:5.5,slope:.5,gap:MIX_GAP},   // climbs 0.5 block per block, forever
  down:{x:DN_X,y:5.5,slope:-.5,gap:MIX_GAP}
};
const SEC={
  hub:{name:'HUB'},
  mix:{name:'MIX',x:MIX_X,y:5.5},
  straight:{name:'STRAIGHT',x:STR_X,y:5.5},
  up:{name:'UP',x:UP_X,y:5.5},
  down:{name:'DOWN',x:DN_X,y:5.5}
};
function lineAt(id,xb){
  const p=SEC[id].pts;
  if(xb<=p[0][0])return{c:p[0][1],g:p[0][2]};
  for(let i=1;i<p.length;i++)if(xb<=p[i][0]){const a=p[i-1],b=p[i],t=(xb-a[0])/(b[0]-a[0]);return{c:a[1]+(b[1]-a[1])*t,g:a[2]+(b[2]-a[2])*t}}
  const l=p[p.length-1];return{c:l[1],g:l[2]};
}
const KEY={x:16*U,y:7.2*U};
const speedPortals=SPEEDS.map((s,i)=>({...s,x:SPD_X*U,y:i*2.75*U,w:U,h:2.75*U}));
const lanePortals=[
  {id:'up',l:'Up',c:'#2ee6ff',x:LANE_X*U,y:7.6*U,w:U,h:3*U},
  {id:'straight',l:'Straight',c:'#2ee6ff',x:LANE_X*U,y:4.3*U,w:U,h:3.2*U},
  {id:'down',l:'Down',c:'#2ee6ff',x:LANE_X*U,y:1*U,w:U,h:3.2*U}
];

// ---- State ----
let W,H,S,px,py,speed,keyed,spDone,cur,curEnd,pFrom,ins,tot,outside,flash=0,camY=0;
let holding=false,won=false,winT=0,runs=1,trail=[],presses=[],maxCps=0,finalCps=0;
function resize(){const d=devicePixelRatio||1;W=cv.width=innerWidth*d;H=cv.height=innerHeight*d;S=H/VIEW_H}
addEventListener('resize',resize);resize();
function reset(){px=0;py=VIEW_H/2;speed=SPEEDS[1].v;keyed=false;spDone=false;cur='hub';buildSec('mix');curEnd=SEC.mix.end*U;pFrom=0;ins=0;tot=0;outside=false;won=false;winT=0;flash=0;camY=0;trail=[];presses=[];maxCps=0}
reset();
function restart(){runs++;reset()}

// ---- Input (timestamped so every tap registers) ----
const q=[];let want=false;
const down=(v,t)=>{if(v===want)return;want=v;q.push({t:t||performance.now(),v})};
addEventListener('keydown',e=>{
  if(e.code==='KeyR'){runs=1;reset();return}
  if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();down(true,e.timeStamp);if(won&&!e.repeat)restart()}
});
addEventListener('keyup',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code))down(false,e.timeStamp)});
addEventListener('pointerdown',e=>{down(true,e.timeStamp);if(won)restart()});
addEventListener('pointerup',e=>down(false,e.timeStamp));
addEventListener('pointercancel',e=>down(false,e.timeStamp));
addEventListener('blur',()=>down(false));

// ---- Physics ----
const ov=r=>px+HALF>r.x&&px-HALF<r.x+r.w&&py+HALF>r.y&&py-HALF<r.y+r.h;
function step(dt){
  if(won)return;
  px+=speed*dt;
  py+=(holding?1:-1)*SLOPE*speed*dt;
  if(cur!=='up'&&cur!=='down'){if(py<HALF)py=HALF;if(py>VIEW_H-HALF)py=VIEW_H-HALF}   // UP/DOWN scroll forever, no floor/ceiling
  if(cur==='hub'){
    if(!keyed&&Math.hypot(px-KEY.x,py-KEY.y)<22)keyed=true;
    if(!keyed&&px>=(SPD_X-3)*U){px=0;trail=[];flash=.6}   // no key yet: hub loops until you grab it
    if(keyed&&!spDone){for(const s of speedPortals)if(ov(s)){speed=s.v;spDone=true;buildSec('mix');curEnd=SEC.mix.end*U;break}}
    if(keyed&&spDone){
      for(const p of lanePortals)if(ov(p)){
        buildSec(p.id);const s=SEC[p.id];cur=p.id;px=(s.x-8)*U;py=s.y*U;curEnd=s.end*U;pFrom=s.x*U;trail=[];ins=tot=0;outside=false;flash=1;break;
      }
    }
    if(cur==='hub'&&px>=MIX_X*U){cur='mix';pFrom=MIX_X*U;ins=tot=0}
  }
  if(cur!=='hub'&&px>=pFrom){
    tot+=dt;const l=lineAt(cur,px/U);
    outside=Math.abs(py/U-l.c)>l.g/2;
    if(!outside)ins+=dt;
  }
  if(px>=curEnd){won=true;finalCps=maxCps;winT=performance.now()}
}
let simT=performance.now();
function pushTrail(){if(!won){trail.push({x:px,y:py});if(trail.length>160)trail.shift()}}
function advance(to){while(to-simT>0){const dt=Math.min(1/240,(to-simT)/1000);step(dt);simT+=dt*1000}}
function frame(){
  const now=performance.now();
  if(now-simT>50)simT=now-50;
  while(q.length){const e=q.shift();advance(Math.min(Math.max(e.t,simT),now));holding=e.v;if(e.v)presses.push(e.t);pushTrail()}
  advance(now);
  if(won&&now-winT>3500)restart();   // level loops: back to the very start, pick speed + mode again
  pushTrail();draw();requestAnimationFrame(frame);
}

// ---- Drawing ----
const Y=y=>H-(y-camY)*S;
function sign(text,x,y,size,align){
  ctx.font=`bold ${size}px "Trebuchet MS",system-ui,sans-serif`;ctx.textAlign=align||'center';ctx.lineJoin='round';
  ctx.strokeStyle='#04140a';ctx.lineWidth=size*.22;ctx.strokeText(text,x,y+size*.06);
  ctx.fillStyle='#fff';ctx.fillText(text,x,y);
}
function sparkle(cx,cy,r,col,n){
  const t=performance.now();ctx.fillStyle=col;
  for(let i=0;i<n;i++){const a=t/900+i*6.283/n*1.0+Math.sin(i*7)*2,rr=r*(.8+.35*Math.sin(t/350+i*3));
    ctx.fillRect(cx+Math.cos(a)*rr*.45,cy+Math.sin(a)*rr,S*1.6,S*1.6)}
}
function portal(p,X,size){
  const cx=X(p.x+p.w/2),cy=Y(p.y+p.h/2),rx=S*7,ry=p.h*S/2;
  ctx.fillStyle='#03121c';ctx.beginPath();ctx.ellipse(cx+S*6,cy,rx,ry,0,0,6.283);ctx.fill();
  ctx.strokeStyle='#000';ctx.lineWidth=S*2.5;ctx.stroke();
  ctx.fillStyle='rgba(0,30,50,.88)';ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,6.283);ctx.fill();
  ctx.strokeStyle=p.c;ctx.lineWidth=S*2.5;ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(cx+S*5,cy);ctx.lineTo(cx-S*3,cy-S*4);ctx.lineTo(cx-S*1,cy);ctx.lineTo(cx-S*3,cy+S*4);ctx.closePath();ctx.fill();
  sparkle(cx+S*2,cy,ry,p.c,12);
  sign(p.l,cx-rx-S*8,cy-S*1,size,'right');
  sign('-->',cx-rx-S*8,cy+size*.9,size*.8,'right');
}
function guide(id,X){
  const p=SEC[id].pts;
  ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(2,S*1.4);ctx.lineJoin='round';ctx.lineCap='round';
  ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=S*2;
  for(const sg of[1,-1]){ctx.beginPath();ctx.moveTo(X(p[0][0]*U),Y(sg>0?camY+VIEW_H+U:camY-U));p.forEach(a=>ctx.lineTo(X(a[0]*U),Y((a[1]+sg*a[2]/2)*U)));ctx.stroke()}
  ctx.shadowBlur=0;
}
function draw(){
  const camX=px-W/S*CAM_OFFSET, X=x=>(x-camX)*S;
  const vert=cur==='up'||cur==='down';
  const nowC=performance.now(),dtC=Math.min(.05,(nowC-(draw.t||nowC))/1000);draw.t=nowC;
  // follow the channel (mostly) instead of the zig-zagging wave, so the screen doesn't shake
  const tgt=vert?lineAt(cur,px/U).c*U*.8+py*.2-VIEW_H/2:0;
  camY+=(tgt-camY)*(1-Math.exp(-dtC*CAM_FOLLOW));
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2f9a52');g.addColorStop(1,'#195f35');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=Math.max(1,S*.5);ctx.beginPath();
  for(let x=Math.floor(camX/U)*U;X(x)<W;x+=U){ctx.moveTo(X(x),0);ctx.lineTo(X(x),H)}
  for(let y=Math.floor(camY/U)*U;y<=camY+VIEW_H+U;y+=U){ctx.moveTo(0,Y(y));ctx.lineTo(W,Y(y))}ctx.stroke();

  // guide lines
  if(cur==='hub'){
    ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(2,S*1.4);ctx.lineJoin='round';ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=S*2;
    if(keyed&&spDone){ctx.beginPath();for(const p of lanePortals){ctx.moveTo(X((SPD_X+3)*U),Y(5.5*U));ctx.lineTo(X(p.x),Y(p.y+p.h/2))}ctx.stroke()}
    ctx.shadowBlur=0;guide('mix',X);
  }else guide(cur,X);
  ctx.fillStyle='rgba(255,255,255,.8)';ctx.fillRect(X(curEnd),0,S*1.5,H);

  // key + sign
  if(!keyed&&cur==='hub'){
    sign('Settings:',X(KEY.x),Y(KEY.y+2.6*U),S*17);
    const kx=X(KEY.x),ky=Y(KEY.y+Math.sin(performance.now()/300)*3);
    const keyPath=()=>{ctx.beginPath();ctx.arc(kx-S*8,ky,S*6,0,6.283);ctx.moveTo(kx-S*2,ky);ctx.lineTo(kx+S*12,ky);ctx.moveTo(kx+S*8,ky);ctx.lineTo(kx+S*8,ky+S*5);ctx.moveTo(kx+S*12,ky);ctx.lineTo(kx+S*12,ky+S*5)};
    ctx.lineCap='round';ctx.strokeStyle='#04140a';ctx.lineWidth=S*4.6;keyPath();ctx.stroke();
    ctx.strokeStyle='#fff';ctx.lineWidth=S*2.2;keyPath();ctx.stroke();
    sparkle(kx,ky,S*14,'#fff',8);
  }
  // portals appear after the key is collected
  if(keyed&&cur==='hub'){
    if(!spDone)speedPortals.forEach(p=>portal(p,X,S*9));
    else{
      lanePortals.forEach(p=>portal(p,X,S*11));
      sign('Mix (no input)',X(LANE_X*U)-S*20,Y(.9*U),S*8,'right');
    }
  }
  // trail + wave
  if(trail.length>1){
    ctx.lineJoin='round';ctx.lineCap='round';
    ctx.strokeStyle='#ff4fd8';ctx.lineWidth=S*5;ctx.beginPath();
    trail.forEach((p,i)=>i?ctx.lineTo(X(p.x),Y(p.y)):ctx.moveTo(X(p.x),Y(p.y)));ctx.stroke();
    ctx.strokeStyle='#fff';ctx.lineWidth=S*2;ctx.beginPath();
    trail.forEach((p,i)=>i?ctx.lineTo(X(p.x),Y(p.y)):ctx.moveTo(X(p.x),Y(p.y)));ctx.stroke();
  }
  const ang=Math.atan2((holding?1:-1)*SLOPE,1);
  ctx.save();ctx.translate(X(px),Y(py));ctx.rotate(-ang);
  const s=S*7.2;ctx.fillStyle=outside?'#ff4f4f':'#ff4fd8';ctx.strokeStyle='#fff';ctx.lineWidth=S*.8;
  ctx.beginPath();ctx.moveTo(s,0);ctx.lineTo(-s,s*.8);ctx.lineTo(-s*.5,0);ctx.lineTo(-s,-s*.8);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
  if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash})`;ctx.fillRect(0,0,W,H);flash=Math.max(0,flash-.06)}

  // HUD
  const now=performance.now();presses=presses.filter(t=>now-t<=1000);
  const cps=presses.length;maxCps=Math.max(maxCps,cps);
  const pct=Math.min(100,Math.max(0,(px-pFrom)/(curEnd-pFrom)*100));
  ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(W*.3,S*6,W*.4,S*5);
  ctx.fillStyle='#fff';ctx.fillRect(W*.3,S*6,W*.4*pct/100,S*5);
  sign(pct.toFixed(2)+'%',W*.7+S*5,S*12,S*10,'left');
  if(cur!=='hub'){const tl=Math.max(0,(curEnd-px)/speed);sign('Left '+Math.floor(tl/60)+':'+String(Math.floor(tl%60)).padStart(2,'0'),W*.7+S*5,S*24,S*8,'left')}
  const acc=tot>0?(ins/tot*100).toFixed(1)+'%':'--';
  sign('Accuracy: '+acc,S*8,S*14,S*10,'left');
  sign('CPS: '+cps+'   (max '+maxCps+')',S*8,S*26,S*10,'left');
  sign(SEC[cur].name+' · '+(SPEEDS.find(s=>s.v===speed)||{}).l+' · run '+runs,S*8,S*38,S*8,'left');
  sign('R = restart',S*8,H-S*6,S*8,'left');
  if(cur==='hub'&&!won)sign(!keyed?'Hold click / space / ↑ to go up — grab the key':!spDone?'Pick a speed portal':'Pick a practice portal',W/2,S*26,S*10);
  if(won){
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,W,H);
    sign('Section Complete!',W/2,H/2-S*8,S*26);
    sign('Accuracy '+acc+' · max CPS '+finalCps,W/2,H/2+S*10,S*12);
    sign('Looping back to the start... (R / click to skip)',W/2,H/2+S*26,S*9);
  }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
